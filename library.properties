sentence=Platform-agnostic trajectory (motion profile) generation library.
paragraph=Generates time-parameterized position/velocity/acceleration setpoints for smooth, kinematically-bounded motion. No hardware dependencies — usable on Arduino, Teensy, and Linux x86. The TrajectoryGroup and CartesianMove planners derive from Universal Device Interface's shared IDevice base; the per-axis profile math does not.
category=Signal Input/Output
url=https://github.com/vishwam-aggarwal/Universal-Trajectory-Interface
architectures=*
depends=Universal Device Interface
includes=ITrajectoryProfile.h,TrapezoidalProfile.h,SCurveProfile.h,JerkPercentProfile.h,TrajectoryGroup.h,IPathGeometry.h,LinePath.h,ArcPath.h,CartesianMove.h
