name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # submodules: extern/Universal-Device-Interface, which TrajectoryGroup
      # and CartesianMove derive from -- CMake cannot configure without it.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
